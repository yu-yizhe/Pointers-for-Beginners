name: Update traffic statistics

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-traffic-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and update traffic data without cloning the repository
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          CONTENTS_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          UPDATE_VIA_CONTENTS_API: "1"
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/traffic-data/update_traffic.py" \
            --output /tmp/update_traffic.py
          python /tmp/update_traffic.py
